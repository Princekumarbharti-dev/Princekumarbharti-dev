<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Prince Kumar, Backend Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset=".52" stop-color="#17133a"/>
      <stop offset="1" stop-color="#071c2c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.15 0;.15 0;-.15 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1000" height="240" rx="24" fill="url(#bg)"/>
  <circle cx="120" cy="30" r="90" fill="#7c3aed" opacity=".18" filter="url(#glow)">
    <animate attributeName="cx" values="120;190;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="890" cy="210" r="110" fill="#0891b2" opacity=".16" filter="url(#glow)">
    <animate attributeName="cx" values="890;820;890" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect x="64" y="48" width="5" height="144" rx="2.5" fill="url(#accent)"/>
  <text x="96" y="105" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Prince Kumar</text>
  <text x="98" y="147" fill="#b9c2d3" font-family="Segoe UI,Arial,sans-serif" font-size="22">Backend Engineer · Java · Spring Boot · Microservices</text>
  <text x="98" y="182" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="1.4">BUILDING DEPENDABLE SYSTEMS</text>
  <circle cx="942" cy="36" r="5" fill="#22d3ee">
    <animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>